name: bruno-smoke

on: workflow_dispatch

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Build app image
        run: ./mvnw -B spring-boot:build-image -DskipTests

      - name: Run app container (deterministic payment success)
        run: |
          docker run -d --name app -p 8080:8080 \
            -e PAYMENT_FAILURE_RATE=0.0 \
            ecommerce-checkout:0.0.1-SNAPSHOT

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8080/carts -X POST && exit 0
            sleep 2
          done
          echo "app did not come up"; docker logs app; exit 1

      - name: Run bruno smoke collection
        working-directory: bruno
        run: npx -y @usebruno/cli run checkout/smoke --env local -r

      - name: Dump app logs on failure
        if: failure()
        run: docker logs app

      - name: Stop container
        if: always()
        run: docker rm -f app
